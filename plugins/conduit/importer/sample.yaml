name: voi_archive
config:
  # Path to a voi-fast-follower archive directory (segments/ + checkpoint).
  archive_path: "/data/archive"
  # Network genesis JSON (required by Conduit; not fetched from Voi by this plugin).
  genesis_file: "/data/genesis.json"
  # offline: fail if round is past archive checkpoint
  # follow: poll until the archive advances (live Conduit against a growing archive)
  mode: "follow"
  poll_interval: "200ms"
  # 0 = wait until context cancel only (follow mode)
  wait_timeout: "0s"
