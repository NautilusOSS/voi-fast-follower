network: voi-mainnet

node:
  algod_url: https://mainnet-api.voi.nodely.dev
  algod_token: ""

sync:
  # "latest" or an explicit round number
  start_round: latest
  mode: fast
  poll_interval: 100ms
  workers: 32
  fetch_window: 128
  commit_batch_size: 50
  commit_flush_interval: 200ms

database:
  url: postgres://follower:follower@localhost:5432/voi_follower?sslmode=disable

metrics:
  addr: ":9090"

log:
  level: info
