services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: follower
      POSTGRES_PASSWORD: follower
      POSTGRES_DB: voi_follower
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U follower -d voi_follower"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local Voi mainnet algod for Phase 3 benchmarks (REST API only).
  # Uses xarmian/voinode (arm64-friendly) with Voi genesis + fast catchup.
  # Official ghcr.io/voinetwork/voi-node is amd64-only and crashes under QEMU
  # on Apple Silicon (Go lfstack.push).
  voi-node:
    image: xarmian/voinode:latest
    platform: linux/arm64
    environment:
      NETWORK: voimain-v1.0
      FAST_CATCHUP: "1"
      TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TELEMETRY_NAME: ""
    ports:
      # Host 4001 avoids local Vite/dev servers commonly bound to 8080.
      - "4001:8080"
    volumes:
      - voi-algod-data:/algod/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'X-Algo-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' http://127.0.0.1:8080/v2/status >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Dev stack. For production-oriented defaults (archive required, locked-down ports)
  # use docker-compose.prod.yml — see docs/phase9-production.md.
  follower:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VOI_ALGOD_URL: ${VOI_ALGOD_URL:-https://mainnet-api.voi.nodely.dev}
      VOI_ALGOD_TOKEN: ${VOI_ALGOD_TOKEN:-}
      VOI_START_ROUND: ${VOI_START_ROUND:-latest}
      START_ROUND: ${START_ROUND:-}
      VOI_SYNC_MODE: ${VOI_SYNC_MODE:-fast}
      DATABASE_URL: postgres://follower:follower@postgres:5432/voi_follower?sslmode=disable
      POLL_INTERVAL: ${POLL_INTERVAL:-100ms}
      WORKERS: ${WORKERS:-32}
      FETCH_WINDOW: ${FETCH_WINDOW:-128}
      COMMIT_BATCH_SIZE: ${COMMIT_BATCH_SIZE:-10}
      COMMIT_FLUSH_INTERVAL: ${COMMIT_FLUSH_INTERVAL:-200ms}
      PG_INSERT_MODE: ${PG_INSERT_MODE:-unnest}
      PG_ASYNC_COMMIT: ${PG_ASYNC_COMMIT:-false}
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-false}
      ARCHIVE_PATH: ${ARCHIVE_PATH:-/data/archive}
      ARCHIVE_SEGMENT_SIZE: ${ARCHIVE_SEGMENT_SIZE:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ADDR: ":9090"
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      MIGRATIONS_PATH: /app/migrations
    volumes:
      - follower-archive:/data/archive
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres-data:
  voi-algod-data:
  follower-archive:
